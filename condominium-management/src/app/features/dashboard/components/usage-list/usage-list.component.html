<div class="card">
  <div class="card-header">
    {{ title }}
  </div>
  <div class="card-body">
    <div *ngIf="!records || records.length === 0" class="alert alert-info">
      No usage records available.
    </div>
    <div class="table-responsive-wrapper"> <!-- Added this wrapper -->
      <table *ngIf="records && records.length > 0" class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">House ID</th>
            <th scope="col">Type</th>
            <th scope="col">Usage</th>
            <th scope="col">Month</th>
            <th scope="col">Year</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let record of records">
            <td>{{ record.recordedAt | date:'yyyy-MM-dd HH:mm' }}</td>
            <td>{{ record.houseId }}</td>
            <td>{{ record.type }}</td>
            <td>{{ record.usage }}</td>
            <td>{{ record.month }}</td>
            <td>{{ record.year }}</td>
          </tr>
        </tbody>
      </table>
    </div> <!-- End of wrapper -->
  </div>
</div>
